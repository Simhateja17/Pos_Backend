name: Deploy backend to GCP VMs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation — no stored key

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma generate (npm install's postinstall) just needs a resolvable
      # connection string to introspect the schema — both regions' DBs are
      # schema-identical, so either works for this build-only check.
      DATABASE_URL: ${{ secrets.DATABASE_URL_IN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - region: india
            instance: ambel-india-backend
            zone: asia-south1-c
            api_host: api-in.ambelpos.com
            database_url_secret: DATABASE_URL_IN
            rls_database_url_secret: RLS_DATABASE_URL_IN
          - region: international
            instance: instance-20260821-044801
            zone: us-central1-c
            api_host: api-us.ambelpos.com
            database_url_secret: DATABASE_URL_INTL
            rls_database_url_secret: RLS_DATABASE_URL_INTL
    env:
      GCP_PROJECT: refreshing-oven-489212-j9
      DATABASE_URL: ${{ secrets[matrix.database_url_secret] }}
      RLS_DATABASE_URL: ${{ secrets[matrix.rls_database_url_secret] }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration decision compares this commit with its immediate
          # predecessor. A shallow one-commit checkout cannot make that safe.
          fetch-depth: 2

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Detect checked-in migration changes
        id: migration_changes
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 \
            && git diff --quiet HEAD^ HEAD -- supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SQL migration changed; skipping db push for this code-only release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SQL migration change detected; db push is required."
          fi

      - name: Apply checked-in Supabase migrations (${{ matrix.region }})
        if: steps.migration_changes.outputs.changed == 'true'
        run: npm exec --yes supabase@latest -- db push --db-url "$DATABASE_URL" --include-all

      - name: Deploy and verify backend (${{ matrix.region }})
        run: |
          # The app and its PM2 daemon live under the `simhateja` account on the
          # VM. OS Login logs CI in as a per-service-account user, so the remote
          # script must be re-entered as `simhateja` (`-H` fixes $HOME) or
          # $HOME/Ambel_pos does not exist and `pm2 reload` finds no daemon.
          # Piped over stdin rather than passed via --command to avoid nesting
          # three levels of shell quoting.
          cat > remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 24 >/dev/null
          cd "$HOME/Ambel_pos/backend" && git pull --ff-only origin main
          cd "$HOME/Ambel_pos" && bash deploy/deploy.sh
          if ! curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:4000/health; then
            pm2 status
            pm2 logs backend --lines 60 --nostream
            exit 1
          fi
          REMOTE
          gcloud compute ssh "${{ matrix.instance }}" \
            --zone="${{ matrix.zone }}" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --command='sudo -u simhateja -H bash -s' < remote-deploy.sh

      - name: Verify public HTTPS endpoint (${{ matrix.region }})
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-connrefused \
            "https://${{ matrix.api_host }}/health"
